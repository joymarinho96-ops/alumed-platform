<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔬 Microscopio Virtual - UFRJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #1e293b; color: white; overflow-y: auto; padding: 20px; border-right: 2px solid #334155; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .toolbar { background: #1e293b; border-bottom: 2px solid #334155; padding: 15px; display: flex; gap: 10px; }
        .viewer { flex: 1; background: #111827; display: flex; align-items: center; justify-content: center; position: relative; }
        .viewer img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .info { background: #1e293b; padding: 15px; border-top: 2px solid #334155; color: #cbd5e1; font-size: 0.9em; }
        .btn { padding: 10px 15px; background: #0ea5e9; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #06b6d4; }
        .lamina-btn { display: block; width: 100%; padding: 10px; margin: 8px 0; background: #334155; color: white; border: none; border-radius: 5px; cursor: pointer; text-align: left; font-size: 0.85em; }
        .lamina-btn:hover { background: #0ea5e9; }
        .lamina-btn.active { background: #0ea5e9; font-weight: bold; }
        .categoria-title { margin-top: 20px; font-weight: bold; color: #0ea5e9; margin-bottom: 10px; border-bottom: 2px solid #0ea5e9; padding-bottom: 5px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <h1 style="font-size: 1.5em; margin-bottom: 20px;">🔬 Microscopio</h1>
            <div id="laminas-list"></div>
        </div>

        <!-- MAIN AREA -->
        <div class="main">
            <!-- TOOLBAR -->
            <div class="toolbar">
                <button class="btn" onclick="downloadImage()" title="Descargar">📥 Descargar</button>
                <button class="btn" onclick="toggleZoom()" title="Zoom">🔍 Zoom Toggle</button>
                <button class="btn" onclick="clearCanvas()" title="Limpiar">✂️ Limpiar</button>
            </div>

            <!-- VIEWER -->
            <div class="viewer" id="viewer">
                <div style="text-align: center; color: #64748b;">
                    <p style="font-size: 3em;">🔬</p>
                    <p>Selecciona una lámina</p>
                </div>
            </div>

            <!-- INFO -->
            <div class="info">
                <strong id="lamina-nombre">No seleccionada</strong><br>
                <span id="lamina-desc" style="font-size: 0.85em; color: #94a3b8;"></span>
            </div>
        </div>
    </div>

    <script>
        // DADOS - SVG VÁLIDOS E FUNCIONAIS
        const laminas = {
            'Embriología': [
                { id: 'lamina02', nombre: 'Cordón Umbilical', desc: 'Dos arterias y una vena', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23f3e8ce"/><circle cx="400" cy="250" r="60" fill="%23c41e3a"/><circle cx="350" cy="300" r="40" fill="%232e7d9f"/><circle cx="450" cy="300" r="40" fill="%232e7d9f"/><text x="400" y="450" font-size="32" text-anchor="middle" fill="%23333">Cordón Umbilical</text></svg>' }
            ],
            'Reproductor Masculino': [
                { id: 'lamina03', nombre: 'Testículo (Adulto)', desc: 'Túbulos seminíferos', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23dde5b7"/><ellipse cx="400" cy="280" rx="80" ry="100" fill="%23d4a574"/><circle cx="380" cy="260" r="15" fill="%23a0826d"/><circle cx="420" cy="260" r="15" fill="%23a0826d"/><circle cx="370" cy="300" r="12" fill="%23a0826d"/><circle cx="430" cy="300" r="12" fill="%23a0826d"/><text x="400" y="450" font-size="32" text-anchor="middle" fill="%23333">Testículo</text></svg>' },
                { id: 'lamina19', nombre: 'Testículo y Epidídimo', desc: 'Conductos eferentes', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23cde5b7"/><ellipse cx="400" cy="250" rx="70" ry="90" fill="%23b8956f"/><path d="M 470 300 Q 500 350 480 400" stroke="%23333" stroke-width="8" fill="none"/><circle cx="480" cy="320" r="20" fill="%23d4a574"/><text x="400" y="480" font-size="28" text-anchor="middle" fill="%23333">Epidídimo</text></svg>' }
            ],
            'Digestivo': [
                { id: 'lamina06', nombre: 'Intestino Delgado', desc: 'Vellosidades intestinales', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23fef3c7"/><rect x="250" y="150" width="300" height="200" fill="%23f5deb3" stroke="%23333" stroke-width="2"/><line x1="270" y1="150" x2="265" y2="120" stroke="%23333" stroke-width="3"/><line x1="300" y1="150" x2="300" y2="110" stroke="%23333" stroke-width="3"/><line x1="330" y1="150" x2="335" y2="115" stroke="%23333" stroke-width="3"/><line x1="360" y1="150" x2="360" y2="105" stroke="%23333" stroke-width="3"/><line x1="390" y1="150" x2="390" y2="115" stroke="%23333" stroke-width="3"/><line x1="420" y1="150" x2="425" y2="110" stroke="%23333" stroke-width="3"/><line x1="450" y1="150" x2="450" y2="120" stroke="%23333" stroke-width="3"/><text x="400" y="450" font-size="28" text-anchor="middle" fill="%23333">Intestino Delgado</text></svg>' },
                { id: 'lamina09', nombre: 'Lengua (Conejo)', desc: 'Músculo estriado', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23fecd6f"/><ellipse cx="400" cy="280" rx="60" ry="100" fill="%23d19797"/><circle cx="400" cy="180" r="30" fill="%23c97070"/><line x1="370" y1="280" x2="350" y2="300" stroke="%23c97070" stroke-width="4"/><line x1="430" y1="280" x2="450" y2="300" stroke="%23c97070" stroke-width="4"/><text x="400" y="450" font-size="32" text-anchor="middle" fill="%23333">Lengua</text></svg>' },
                { id: 'lamina17', nombre: 'Esófago', desc: 'Epitelio estratificado', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23ffdeb3"/><rect x="330" y="100" width="140" height="300" fill="%23f5deb3" stroke="%23333" stroke-width="3"/><line x1="330" y1="150" x2="470" y2="150" stroke="%23999" stroke-width="1"/><line x1="330" y1="200" x2="470" y2="200" stroke="%23999" stroke-width="1"/><line x1="330" y1="250" x2="470" y2="250" stroke="%23999" stroke-width="1"/><line x1="330" y1="300" x2="470" y2="300" stroke="%23999" stroke-width="1"/><text x="400" y="470" font-size="32" text-anchor="middle" fill="%23333">Esófago</text></svg>' }
            ],
            'Nervioso': [
                { id: 'lamina08', nombre: 'Médula Espinal (Mono)', desc: 'Sustancia gris en H', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23e9d5ff"/><ellipse cx="400" cy="300" rx="50" ry="120" fill="%23e8d5ff" stroke="%23333" stroke-width="2"/><polygon points="350,280 350,320 330,310 330,290" fill="%23999"/><polygon points="450,280 450,320 470,310 470,290" fill="%23999"/><text x="400" y="480" font-size="24" text-anchor="middle" fill="%23333">Médula Espinal</text></svg>' },
                { id: 'lamina16', nombre: 'Médula Espinal (Plata)', desc: 'Impregnación argéntica', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23f5f3ff"/><ellipse cx="400" cy="300" rx="50" ry="120" fill="%23d4d4e8" stroke="%23333" stroke-width="2"/><polygon points="340,270 340,330 310,300" fill="%23666"/><polygon points="460,270 460,330 490,300" fill="%23666"/><circle cx="370" cy="280" r="5" fill="%23999"/><circle cx="430" cy="280" r="5" fill="%23999"/><text x="400" y="480" font-size="24" text-anchor="middle" fill="%23333">Plata Argéntica</text></svg>' }
            ],
            'Urinario': [
                { id: 'lamina13', nombre: 'Riñón (Perro)', desc: 'Corteza y médula renal', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23efd9ff"/><ellipse cx="400" cy="280" rx="80" ry="110" fill="%23c9a580"/><ellipse cx="400" cy="280" rx="60" ry="90" fill="%23d4b8a8"/><ellipse cx="400" cy="320" rx="40" ry="50" fill="%23b8956f"/><path d="M 440 280 Q 480 300 470 340" stroke="%23333" stroke-width="4" fill="none"/><text x="400" y="480" font-size="32" text-anchor="middle" fill="%23333">Riñón</text></svg>' }
            ],
            'Esquelético': [
                { id: 'lamina14', nombre: 'Hueso Compacto', desc: 'Sistemas de Havers', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23f3e8ce"/><rect x="280" y="150" width="240" height="200" fill="%23e8d4b8" stroke="%23333" stroke-width="2"/><circle cx="320" cy="200" r="25" fill="none" stroke="%23666" stroke-width="2"/><circle cx="320" cy="200" r="15" fill="%23fff"/><circle cx="400" cy="200" r="25" fill="none" stroke="%23666" stroke-width="2"/><circle cx="400" cy="200" r="15" fill="%23fff"/><circle cx="480" cy="200" r="25" fill="none" stroke="%23666" stroke-width="2"/><circle cx="480" cy="200" r="15" fill="%23fff"/><text x="400" y="450" font-size="32" text-anchor="middle" fill="%23333">Hueso</text></svg>' }
            ],
            'Respiratorio': [
                { id: 'lamina15', nombre: 'Tráquea y Esófago', desc: 'Cartílago hialino', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23f0f9ff"/><rect x="350" y="120" width="100" height="200" fill="%23b3d9ff" stroke="%23333" stroke-width="2"/><path d="M 380 120 Q 380 110 400 110 Q 420 110 420 120" stroke="%23333" stroke-width="3" fill="none"/><path d="M 380 140 Q 380 130 400 130 Q 420 130 420 140" stroke="%23333" stroke-width="3" fill="none"/><path d="M 380 160 Q 380 150 400 150 Q 420 150 420 160" stroke="%23333" stroke-width="3" fill="none"/><rect x="300" y="280" width="120" height="80" fill="%23d4a574" stroke="%23333" stroke-width="2"/><text x="400" y="470" font-size="28" text-anchor="middle" fill="%23333">Tráquea</text></svg>' }
            ],
            'Linfático': [
                { id: 'lamina20', nombre: 'Bazo (Perro)', desc: 'Pulpa roja y blanca', url: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="%23fedbef"/><ellipse cx="400" cy="280" rx="70" ry="110" fill="%23c97070"/><ellipse cx="380" cy="250" rx="35" ry="45" fill="%23e8c8c8"/><ellipse cx="420" cy="260" rx="30" ry="40" fill="%23e8c8c8"/><circle cx="400" cy="320" r="25" fill="%23a05858"/><text x="400" y="470" font-size="32" text-anchor="middle" fill="%23333">Bazo</text></svg>' }
            ]
        };

        let currentLamina = null;

        // INICIALIZAR SIDEBAR
        function initSidebar() {
            const list = document.getElementById('laminas-list');
            list.innerHTML = '';
            
            for (const [categoria, items] of Object.entries(laminas)) {
                const catDiv = document.createElement('div');
                
                // Título de categoría
                const catTitle = document.createElement('div');
                catTitle.className = 'categoria-title';
                catTitle.textContent = categoria;
                catDiv.appendChild(catTitle);
                
                // Botones de láminas
                items.forEach((lamina, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'lamina-btn';
                    btn.textContent = `${idx+1}. ${lamina.nombre}`;
                    btn.onclick = (e) => {
                        loadLamina(lamina);
                        // Marcar como activo
                        document.querySelectorAll('.lamina-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                    };
                    catDiv.appendChild(btn);
                });
                
                list.appendChild(catDiv);
            }
        }

        // CARGAR LÁMINA
        function loadLamina(lamina) {
            currentLamina = lamina;
            const viewer = document.getElementById('viewer');
            viewer.innerHTML = `<img src="${lamina.url}" alt="${lamina.nombre}" style="max-width: 90%; max-height: 90%; object-fit: contain;">`;
            
            // Actualizar info
            document.getElementById('lamina-nombre').textContent = lamina.nombre;
            document.getElementById('lamina-desc').textContent = lamina.desc;
        }

        // DESCARGAR IMAGEN
        function downloadImage() {
            if (!currentLamina) {
                alert('Selecciona una lámina primero');
                return;
            }
            // Los SVG data URIs se pueden descargar directamente
            const link = document.createElement('a');
            link.href = currentLamina.url;
            link.download = currentLamina.nombre.replace(/\s+/g, '_') + '.svg';
            link.click();
        }

        // TOGGLE ZOOM
        function toggleZoom() {
            const img = document.querySelector('.viewer img');
            if (img) {
                img.style.maxWidth = img.style.maxWidth === '90%' ? '100%' : '90%';
            }
        }

        // LIMPIAR
        function clearCanvas() {
            document.getElementById('viewer').innerHTML = '<div style="text-align: center; color: #64748b;"><p style="font-size: 3em;">🔬</p><p>Selecciona una lámina</p></div>';
            document.getElementById('lamina-nombre').textContent = 'No seleccionada';
            document.getElementById('lamina-desc').textContent = '';
            currentLamina = null;
            document.querySelectorAll('.lamina-btn').forEach(b => b.classList.remove('active'));
        }

        // INICIALIZAR
        initSidebar();
        const firstCategory = Object.values(laminas)[0];
        if (firstCategory && firstCategory.length > 0) {
            loadLamina(firstCategory[0]);
            // Marcar primer botón como activo
            document.querySelector('.lamina-btn').classList.add('active');
        }
    </script>
</body>
</html>
